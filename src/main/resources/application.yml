server:
  port: 8080
  # SSE 长连接不超时
  servlet:
    session:
      timeout: 30m

spring:
  application:
    name: medical-agent-platform
  # 同时引入 web + webflux：web 决定应用类型为 SERVLET（MemoryInterceptor 生效），
  # webflux 提供 Reactor 使 MVC 控制器可返回 Flux<ServerSentEvent> 流式 SSE。
  main:
    web-application-type: servlet

  ai:
    openai:
      # 生产请改用环境变量/密钥管理，勿硬编码
      api-key: ${OPENAI_API_KEY:sk-xxxx}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      chat:
        options:
          model: gpt-4o
          temperature: 0.2
      embedding:
        options:
          model: text-embedding-3-small
    # ===== Milvus 向量库 =====
    vectorstore:
      milvus:
        client:
          uri: ${MILVUS_URI:http://127.0.0.1:19530}
          # token: ${MILVUS_TOKEN:}
        collection-name: medical_knowledge_v1
        dimension: 1536
        vector-field-name: embedding
        content-field-name: content
        metadata-field-name: metadata
        index-type: IVF_FLAT
        metric-type: COSINE
        # 开启自动建表
        initialize-schema: true

  # ===== Elasticsearch：推理审计 =====
  elasticsearch:
    uris: ${ES_URIS:http://127.0.0.1:9200}
    # username: ${ES_USERNAME:}
    # password: ${ES_PASSWORD:}

# ===== 业务自定义配置 =====
medical:
  memory:
    # Token 归档阈值（默认 4000），超过则把更早历史切分为话题段归档
    compression-token-threshold: 4000
    # 归档后保留的最近原始消息条数（保证近距指代可解析）
    recent-messages-keep: 6
    # 归档后「固定注入 Token」的目标下降比例（观测指标）
    target-compression-ratio: 0.38
    # 相邻对话轮相似度低于该值即判定为话题边界（0~1，需按所用 embedding 模型实测调整）
    topic-boundary-threshold: 0.50
    # 当前问题与历史话题段相似度低于该值视为无关，本轮不注入该段
    relevant-segment-min-score: 0.35
    # 单轮最多注入的历史话题段数量
    max-relevant-segments: 3
    # 话题段库保留上限，超出丢弃最旧的段，防止无限增长
    max-segments-retained: 50
    # 是否抽取跨话题常驻的医学关键事实（过敏史/慢病/在服药物，始终注入）
    key-facts-enabled: true
  rag:
    # 阶段一：向量 TopK 与 BM25 TopK
    vector-top-k: 50
    bm25-top-k: 50
    # 阶段一后合并去重保留候选数（用于精排）
    hybrid-candidate-k: 100
    # 阶段二精排输出
    rerank-top-k: 5
    # 切片参数
    chunk-size: 512
    chunk-overlap: 50
    rerank:
      # cohere | local（本地交叉编码器/语义重排）
      provider: local
      cohere:
        api-key: ${COHERE_API_KEY:}
        model: rerank-english-v3.0
  agent:
    # 多智能体协同：投票/加权汇总阈值
    confidence-threshold: 0.6
    # 诊断假设最大数量
    max-hypotheses: 5
  think:
    # reasoning_effort 开启（o 系列模型生效，普通模型自动忽略）
    reasoning-effort: high
    sse-timeout-seconds: 120
